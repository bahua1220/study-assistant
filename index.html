<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="个人学习助手 — 打卡 · 单词 · 课程 · 成绩" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Study App</title>
  </head>
  <body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">
    <div id="root">
      <div class="app-startup-placeholder" role="status" aria-label="应用启动中">
        <div class="app-startup-spinner"></div>
        <p>正在启动学习助手…</p>
      </div>
    </div>
    <style>
      .app-startup-placeholder{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#71717a;font:14px system-ui,sans-serif;background:#fff}
      .app-startup-spinner{width:32px;height:32px;border:3px solid #e4e4e7;border-top-color:#6366f1;border-radius:50%;animation:app-spin .8s linear infinite}
      @keyframes app-spin{to{transform:rotate(360deg)}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
